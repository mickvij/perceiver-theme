name: Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Tests draaien ──────────────────────────────────────────────────
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependencies installeren
        run: npm ci
        working-directory: tests

      - name: Playwright browsers installeren
        run: npx playwright install --with-deps chromium webkit
        working-directory: tests

      - name: Tests draaien tegen live site
        env:
          # Gebruik staging URL als die beschikbaar is, anders live
          TEST_URL: ${{ vars.STAGING_URL || 'https://perceiver.nl' }}
        run: npx playwright test --config=playwright.config.js
        working-directory: tests

      - name: Test rapport uploaden bij failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 7

  # ── JOB 2: Deploy naar productie (alleen bij push naar main) ──────────────
  deploy-production:
    name: Deploy naar Productie
    runs-on: ubuntu-latest
    needs: test  # Pas deployen ALS tests geslaagd zijn
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Volledige git history nodig voor diff

      - name: .deploy-config aanmaken vanuit secrets
        run: |
          echo "SFTP_HOST=${{ secrets.SFTP_HOST }}" > .deploy-config
          echo "SFTP_USER=${{ secrets.SFTP_USER }}" >> .deploy-config
          echo "SFTP_PASS=${{ secrets.SFTP_PASS }}" >> .deploy-config

      - name: .last-deploy instellen (altijd alles bij CI deploy)
        run: echo "" > /dev/null  # Deploy.sh gebruikt --all in CI

      - name: Deploy naar Strato
        run: bash deploy.sh --all

      - name: .deploy-config opruimen
        if: always()
        run: rm -f .deploy-config
